<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INSIGHT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            /* Main Colors */
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #3498db;
            
            /* Status Colors */
            --success: #2ecc71;
            --info: #3498db;
            --warning: #f1c40f;
            --danger: #e74c3c;
            
            /* Gradients */
            --gradient-primary: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            
            /* Text Colors */
            --text-light: #ffffff;
            --text-dark: #2c3e50;
            --text-muted: rgba(255, 255, 255, 0.9);
            
            /* Background Colors */
            --bg-light: #f8f9fa;
            --bg-white: #ffffff;
            --bg-overlay: rgba(255, 255, 255, 0.1);
            --bg-overlay-hover: rgba(255, 255, 255, 0.2);
            
            /* Border Colors */
            --border-light: #dee2e6;
            
            /* Shadow Colors */
            --shadow-color: rgba(0, 0, 0, 0.1);
            --shadow-color-hover: rgba(0, 0, 0, 0.2);
        }

        body {
            background-color: var(--bg-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .navbar {
            background: var(--gradient-primary) !important;
            padding: 0rem 0;
            box-shadow: 0 2px 8px var(--shadow-color);
        }

        .navbar-brand {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--text-light) !important;
            text-transform: uppercase;
            padding: 0.3rem 0.8rem;
            border-radius: 6px;
            background: var(--bg-overlay);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .navbar-brand:hover {
            transform: translateY(-2px);
            background: var(--bg-overlay-hover);
            box-shadow: 0 4px 12px var(--shadow-color-hover);
        }

        .nav-link {
            font-weight: 500;
            color: var(--text-muted) !important;
            padding: 0.3rem 0.8rem !important;
            margin: 0 0.2rem;
            border-radius: 6px;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .nav-link:hover {
            color: var(--text-light) !important;
            background: var(--bg-overlay);
            transform: translateY(-1px);
        }

        .logout-form button {
            color: var(--text-muted) !important;
            font-weight: 500;
            padding: 0.3rem 0.8rem !important;
            margin: 0 0.2rem;
            border-radius: 6px;
            transition: all 0.3s ease;
            background: none;
            border: none;
            font-size: 0.9rem;
        }

        .logout-form button:hover {
            color: var(--text-light) !important;
            background: var(--bg-overlay);
            transform: translateY(-1px);
        }

        .container {
            padding: 2rem 1rem;
        }

        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 6px var(--shadow-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px var(--shadow-color-hover);
        }

        .card-header {
            border-radius: 10px 10px 0 0 !important;
            font-weight: 600;
        }

        .btn {
            border-radius: 5px;
            font-weight: 500;
            padding: 0.5rem 1rem;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 8px var(--shadow-color);
        }

        .btn-sm {
            padding: 0.25rem 0.5rem;
        }

        .btn i {
            margin-right: 0.25rem;
        }

        .table {
            background: var(--bg-white);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 4px var(--shadow-color);
        }

        .table thead th {
            background-color: var(--primary);
            color: var(--text-light);
            font-weight: 500;
            border: none;
        }

        .table tbody tr {
            transition: background-color 0.3s ease;
        }

        .table tbody tr:hover {
            background-color: var(--bg-light);
        }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .action-buttons .btn {
            padding: 0.25rem 0.5rem;
            border-radius: 5px;
        }

        .alert {
            border: none;
            border-radius: 10px;
            box-shadow: 0 2px 4px var(--shadow-color);
        }

        .form-control {
            border-radius: 5px;
            border: 1px solid var(--border-light);
            padding: 0.5rem 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            box-shadow: 0 0 0 0.2rem rgba(52, 152, 219, 0.25);
            border-color: var(--accent);
        }

        .form-label {
            font-weight: 500;
            color: var(--text-dark);
        }

        .search-container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 2rem;
            background: var(--bg-white);
            border-radius: 10px;
            box-shadow: 0 4px 6px var(--shadow-color);
        }

        .student-info {
            margin-top: 2rem;
            padding: 2rem;
            border-radius: 10px;
            background-color: var(--bg-white);
            box-shadow: 0 4px 6px var(--shadow-color);
        }

        .table-container {
            margin-top: 2rem;
        }

        .login-button {
            position: absolute;
            top: 1rem;
            right: 1rem;
        }

        /* Custom button colors */
        .btn-primary {
            background-color: var(--accent);
            border-color: var(--accent);
        }

        .btn-success {
            background-color: var(--success);
            border-color: var(--success);
        }

        .btn-info {
            background-color: var(--info);
            border-color: var(--info);
            color: var(--text-light);
        }

        .btn-warning {
            background-color: var(--warning);
            border-color: var(--warning);
        }

        .btn-danger {
            background-color: var(--danger);
            border-color: var(--danger);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">INSIGHT</a>
            {% if user.is_authenticated %}
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="{% url 'student_list' %}">Student List</a>
                    <form method="post" action="{% url 'logout' %}" class="logout-form">
                        {% csrf_token %}
                        <button type="submit" class="nav-link btn btn-link">Logout</button>
                    </form>
                </div>
            {% else %}
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="{% url 'teacher_login' %}">Login</a>
                </div>
            {% endif %}
        </div>
    </nav>

    <div class="container mt-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
        
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
